<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tatiana — Run Timer</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
:root {
  --run:#E94560; --walk:#4ECDC4; --strength:#F9CA24; --bike:#6C63FF;
  --dark:#0A0A0F; --card:#14141E; --card2:#1C1C2A; --text:#F0F0F5; --muted:#555570; --border:#222235;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:var(--dark);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;padding-bottom:40px;overflow-x:hidden;}
.bg-ring{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:600px;height:600px;border-radius:50%;opacity:0.04;background:var(--run);transition:background 0.8s;pointer-events:none;z-index:0;}
body.run-active .bg-ring{background:var(--run);animation:pulse 2s ease-in-out infinite;}
body.walk-active .bg-ring{background:var(--walk);animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:0.04}50%{transform:translate(-50%,-50%) scale(1.15);opacity:0.09}}
.page{position:relative;z-index:1;max-width:440px;margin:0 auto;padding:0 16px;}
.app-header{display:flex;justify-content:space-between;align-items:center;padding:20px 0 14px;}
.logo{font-family:'Bebas Neue';font-size:20px;letter-spacing:4px;color:var(--run);}
.week-badge{font-size:11px;letter-spacing:2px;color:var(--muted);background:var(--card2);border:1px solid var(--border);padding:4px 12px;border-radius:20px;text-transform:uppercase;}
.tabs{display:flex;gap:8px;margin-bottom:16px;}
.tab{flex:1;padding:10px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-size:12px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;text-align:center;font-family:'DM Sans';transition:all 0.2s;}
.tab.active{background:var(--run);color:#fff;border-color:var(--run);}
.week-plan{display:flex;flex-direction:column;gap:8px;}
.day-card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;transition:all 0.3s;}
.day-card.today{border-color:var(--run);box-shadow:0 0 20px rgba(233,69,96,0.15);}
.day-card.done{opacity:0.5;}
.day-header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;cursor:pointer;}
.day-left{display:flex;align-items:center;gap:10px;}
.day-name{font-size:13px;font-weight:500;color:var(--text);}
.day-type-badge{font-size:10px;letter-spacing:2px;text-transform:uppercase;padding:3px 10px;border-radius:20px;font-weight:500;}
.badge-run{background:rgba(233,69,96,0.15);color:var(--run);}
.badge-strength{background:rgba(249,202,36,0.15);color:var(--strength);}
.badge-bike{background:rgba(108,99,255,0.15);color:var(--bike);}
.badge-walk{background:rgba(78,205,196,0.15);color:var(--walk);}
.badge-rest{background:rgba(85,85,112,0.15);color:var(--muted);}
.today-label{font-size:10px;letter-spacing:2px;color:var(--run);text-transform:uppercase;font-weight:500;}
.done-check{font-size:18px;}
.day-body{padding:0 16px 16px;display:none;}
.day-card.today .day-body,.day-card.expanded .day-body{display:block;}
.day-desc{font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:14px;font-style:italic;}
.session-actions{display:flex;gap:8px;flex-wrap:wrap;}
.btn-start-run{flex:1;padding:13px;border-radius:30px;border:none;background:var(--run);color:#fff;font-family:'Bebas Neue';font-size:16px;letter-spacing:3px;cursor:pointer;transition:all 0.2s;min-width:120px;}
.btn-start-run:active{transform:scale(0.96);}
.btn-mark-done{padding:13px 20px;border-radius:30px;border:1px solid var(--border);background:var(--card2);color:var(--muted);font-family:'DM Sans';font-size:13px;cursor:pointer;transition:all 0.2s;white-space:nowrap;}
.btn-mark-done.done-state,.btn-full-done.done-state{border-color:#27AE60;color:#27AE60;}
.btn-full-done{width:100%;padding:14px;border-radius:30px;border:1px solid var(--border);background:var(--card2);color:var(--muted);font-family:'DM Sans';font-size:13px;cursor:pointer;transition:all 0.2s;}
/* Timer screen */
#timerScreen{display:none;}
.timer-header{display:flex;align-items:center;gap:12px;padding:20px 0 14px;}
.btn-back{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.timer-title{font-family:'Bebas Neue';font-size:18px;letter-spacing:3px;}
.phase-badge{display:inline-block;font-family:'Bebas Neue';font-size:12px;letter-spacing:4px;padding:5px 18px;border-radius:30px;background:var(--run);color:#fff;transition:all 0.5s;}
body.walk-active .phase-badge{background:var(--walk);color:var(--dark);}
body.idle .phase-badge{background:var(--card2);color:var(--muted);}
.timer-center{display:flex;justify-content:center;margin:14px 0;}
.timer-wrap{position:relative;width:240px;height:240px;}
.timer-svg{position:absolute;top:0;left:0;transform:rotate(-90deg);}
.timer-track{fill:none;stroke:var(--card2);stroke-width:8;}
.timer-progress{fill:none;stroke:var(--run);stroke-width:8;stroke-linecap:round;stroke-dasharray:691;stroke-dashoffset:0;transition:stroke-dashoffset 1s linear,stroke 0.5s;}
body.walk-active .timer-progress{stroke:var(--walk);}
.timer-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;}
.time-display{font-family:'Bebas Neue';font-size:68px;line-height:1;letter-spacing:2px;color:var(--run);transition:color 0.5s;}
body.walk-active .time-display{color:var(--walk);}
body.idle .time-display{color:var(--text);}
.interval-label{font-size:10px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;}
.stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px;}
.stat-card{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:12px 8px;text-align:center;}
.stat-val{font-family:'Bebas Neue';font-size:24px;letter-spacing:1px;}
.stat-label{font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-top:2px;}
.lap-dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-bottom:16px;padding:0 8px;}
.dot{width:9px;height:9px;border-radius:50%;background:var(--card2);border:1px solid var(--border);transition:all 0.3s;}
.dot.run-done{background:var(--run);border-color:var(--run);}
.dot.walk-done{background:var(--walk);border-color:var(--walk);}
.dot.active{transform:scale(1.4);}
.controls{display:flex;gap:12px;align-items:center;justify-content:center;margin-bottom:14px;}
.btn-main{width:72px;height:72px;border-radius:50%;border:none;background:var(--run);color:#fff;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;box-shadow:0 0 24px rgba(233,69,96,0.4);}
body.walk-active .btn-main{background:var(--walk);box-shadow:0 0 24px rgba(78,205,196,0.4);}
.btn-main:active{transform:scale(0.94);}
.btn-secondary{width:48px;height:48px;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--muted);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;}
.next-preview{text-align:center;font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:16px;}
.next-preview span{color:var(--text);}
/* Complete overlay */
.complete-overlay{display:none;position:fixed;inset:0;background:var(--dark);z-index:100;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:30px;text-align:center;}
.complete-overlay.show{display:flex;}
.complete-title{font-family:'Bebas Neue';font-size:52px;color:var(--run);letter-spacing:4px;}
.complete-time{font-family:'Bebas Neue';font-size:52px;color:var(--walk);}
.complete-sub{font-size:14px;color:var(--muted);line-height:1.7;}
.btn-done-final{padding:16px 48px;border-radius:30px;border:2px solid var(--walk);background:transparent;color:var(--walk);font-family:'Bebas Neue';font-size:20px;letter-spacing:4px;cursor:pointer;transition:all 0.2s;}
.btn-done-final.synced{border-color:#27AE60;color:#27AE60;}
.btn-done-final.syncing{border-color:var(--strength);color:var(--strength);}
.btn-back-plan{padding:12px 32px;border-radius:30px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-family:'DM Sans';font-size:13px;cursor:pointer;}
/* Log */
.log-panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;}
.log-panel h3{font-size:10px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;margin-bottom:12px;}
.log-streak{font-size:12px;color:var(--muted);margin-bottom:10px;}
.log-streak strong{font-family:'Bebas Neue';font-size:18px;color:var(--run);}
.log-empty{font-size:12px;color:var(--muted);text-align:center;padding:8px 0;line-height:1.6;}
.log-entry{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);animation:fadeIn 0.3s ease;}
.log-entry:last-child{border-bottom:none;}
.log-left{display:flex;flex-direction:column;gap:2px;}
.log-name{font-size:13px;color:var(--text);font-weight:500;}
.log-date{font-size:11px;color:var(--muted);}
.log-time{font-family:'Bebas Neue';font-size:18px;color:var(--walk);letter-spacing:1px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body class="idle">
<div class="bg-ring"></div>

<!-- ══ PLAN SCREEN ══ -->
<div class="page" id="planScreen">
  <div class="app-header">
    <div class="logo">TATIANA</div>
    <div class="week-badge">Phase 1 · Week 1</div>
  </div>
  <div class="tabs">
    <div class="tab active" onclick="showTab('plan')">This Week</div>
    <div class="tab" onclick="showTab('log')">History</div>
  </div>
  <div id="planTab"><div class="week-plan" id="weekPlan"></div></div>
  <div id="logTab" style="display:none;">
    <div class="log-panel">
      <h3>🏅 Workout history</h3>
      <div class="log-streak" id="logStreak"></div>
      <div id="logList"><div class="log-empty">No workouts logged yet.<br>Complete a session and tap ✓ Done.</div></div>
      <button onclick="exportCSV()" id="exportBtn" style="display:none;margin-top:14px;width:100%;padding:12px;border-radius:30px;border:1px solid var(--border);background:var(--card2);color:var(--muted);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;">⬇ Export history as CSV</button>
    </div>
  </div>
</div>

<!-- ══ TIMER SCREEN ══ -->
<div class="page" id="timerScreen">
  <div class="timer-header">
    <button class="btn-back" onclick="backToPlan()">←</button>
    <div class="timer-title" id="timerTitle">RUN SESSION</div>
  </div>
  <div style="text-align:center;margin-bottom:4px;">
    <div class="phase-badge" id="phaseBadge">READY</div>
  </div>
  <div class="timer-center">
    <div class="timer-wrap">
      <svg class="timer-svg" width="240" height="240" viewBox="0 0 240 240">
        <circle class="timer-track" cx="120" cy="120" r="110"/>
        <circle class="timer-progress" id="progressRing" cx="120" cy="120" r="110"/>
      </svg>
      <div class="timer-inner">
        <div class="time-display" id="timeDisplay">00</div>
        <div class="interval-label" id="intervalLabel">ready</div>
      </div>
    </div>
  </div>
  <div class="stats-row">
    <div class="stat-card"><div class="stat-val" id="lapDisplay">0</div><div class="stat-label">Round</div></div>
    <div class="stat-card"><div class="stat-val" id="totalDisplay">00:00</div><div class="stat-label">Total</div></div>
    <div class="stat-card"><div class="stat-val" id="remainDisplay">—</div><div class="stat-label">Left</div></div>
  </div>
  <div class="lap-dots" id="lapDots"></div>
  <div class="controls">
    <button class="btn-secondary" onclick="resetTimer()">↺</button>
    <button class="btn-main" id="mainBtn" onclick="toggleTimer()">▶</button>
    <button class="btn-secondary" onclick="skipInterval()">⏭</button>
  </div>
  <div class="next-preview" id="nextPreview">Press play to start</div>
</div>

<!-- ══ COMPLETE OVERLAY ══ -->
<div class="complete-overlay" id="completeScreen">
  <div class="complete-title">DONE! 🔥</div>
  <div class="complete-time" id="completeStat"></div>
  <div class="complete-sub">Workout complete.<br><strong style="color:var(--text)">You showed up. That's what counts.</strong></div>
  <button class="btn-done-final" id="doneFinalBtn" onclick="logAndSync()">✓ MARK AS DONE</button>
  <button class="btn-back-plan" onclick="backToPlanFromComplete()">← Back to plan</button>
</div>

<script>
const SHEET_URL = "https://script.google.com/macros/s/AKfycbzzegszVRmHJpa9a0B9ubvsztPC1oeGrez7X1iQZqfSL4ckQDWPFkfERv8_MVnPM6SixQ/exec";

const WEEKLY_PLAN = [
  { day:"Monday",    type:"strength", label:"Strength A", hasTimer:false,
    desc:"Full body · 35 min\nSquats 3×12 · Push-ups 3×10 · Band rows 3×12 · Glute bridges 3×15 · Plank 3×30s" },
  { day:"Tuesday",   type:"run",      label:"Run / Walk", hasTimer:true,
    desc:"Run 1 min · Walk 2 min · 8 rounds · ~30 min\nHead to the park. No pace pressure.",
    workout:{ name:"Week 1 — Run", run:60, walk:120, rounds:8 } },
  { day:"Wednesday", type:"rest",     label:"Easy Walk",  hasTimer:false,
    desc:"Easy day. A gentle 10–20 min walk counts. Fill in your tracker." },
  { day:"Thursday",  type:"bike",     label:"Bike · iFit", hasTimer:false,
    desc:"NordicTrack · 35 min\n5 min warm-up · 25 min steady moderate effort · 5 min cool-down." },
  { day:"Friday",    type:"rest",     label:"Rest Day",   hasTimer:false,
    desc:"Recovery is training. Rest, stretch, hydrate. 💧" },
  { day:"Saturday",  type:"run",      label:"Run / Walk", hasTimer:true,
    desc:"Run 1 min · Walk 2 min · 8 rounds · ~30 min\nSame as Tuesday — you'll already feel easier.",
    workout:{ name:"Week 1 — Run", run:60, walk:120, rounds:8 } },
  { day:"Sunday",    type:"strength", label:"Strength B", hasTimer:false,
    desc:"Full body · 35 min\nBand deadlifts 3×12 · Step-ups 3×10 · Lateral band walks 3×15 · Single-leg glute bridge 3×12 · Dead bug 3×10" }
];

// ── STATE ──
let workoutLog    = JSON.parse(localStorage.getItem('tatiana_log') || '[]');
let currentDayIdx = -1;
let activeWorkout = null;
let timer=null, isRunning=false, currentInterval='run', currentRound=0, timeLeft=0, totalElapsed=0;

// ── AUDIO ──
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function getCtx(){ if(!audioCtx) audioCtx=new AudioCtx(); if(audioCtx.state==='suspended') audioCtx.resume(); return audioCtx; }
function tone(freq,dur,vol=0.5,type='square',delay=0){
  try{ const ctx=getCtx(),o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);o.frequency.value=freq;o.type=type;
    const t=ctx.currentTime+delay;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.start(t);o.stop(t+dur+0.05);}catch(e){}
}
function beepRun(){ tone(523,.12,.7,'square',0);tone(659,.12,.7,'square',.14);tone(880,.35,.9,'square',.28); }
function beepWalk(){ tone(659,.12,.6,'square',0);tone(440,.35,.8,'square',.14); }
function beepDone(){ tone(523,.1,.6,'square',0);tone(659,.1,.6,'square',.12);tone(784,.1,.6,'square',.24);tone(1047,.5,.8,'square',.36); }
function beepTick(){ tone(880,.07,.5,'square'); }

// ── VOICE ──
let selectedVoice=null, speechUnlocked=false;
function loadVoices(){ const v=window.speechSynthesis?speechSynthesis.getVoices():[];if(!v.length)return false;
  selectedVoice=v.find(x=>x.lang==='en-GB')||v.find(x=>x.lang==='en-US')||v.find(x=>x.lang.startsWith('en'))||v[0]||null;return true; }
function unlockSpeech(){ if(speechUnlocked||!window.speechSynthesis)return;speechUnlocked=true;
  if(!loadVoices())speechSynthesis.addEventListener('voiceschanged',loadVoices,{once:true});
  const w=new SpeechSynthesisUtterance('');w.volume=0;speechSynthesis.speak(w); }
function speak(text,delay=0){
  if(!window.speechSynthesis||!speechUnlocked)return;if(!selectedVoice)loadVoices();
  setTimeout(()=>{ try{ speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);
    if(selectedVoice){u.voice=selectedVoice;u.lang=selectedVoice.lang;}else u.lang='en-US';
    u.rate=0.88;u.pitch=1.0;u.volume=1.0;speechSynthesis.speak(u);}catch(e){}},delay); }

// ── TABS ──
function showTab(name){
  document.getElementById('planTab').style.display=name==='plan'?'block':'none';
  document.getElementById('logTab').style.display=name==='log'?'block':'none';
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',(i===0&&name==='plan')||(i===1&&name==='log')));
  if(name==='log')renderLog();
}

// ── WEEK KEY & TODAY ──
function getTodayIdx(){ const js=new Date().getDay(); return js===0?6:js-1; }
function getWeekKey(){ const now=new Date(),day=now.getDay(),diff=now.getDate()-day+(day===0?-6:1),mon=new Date(new Date().setDate(diff)); return mon.toISOString().slice(0,10); }
function getDoneDays(){ const s=JSON.parse(localStorage.getItem('tatiana_daydone')||'{}'); return s[getWeekKey()]||[]; }
function saveDoneDay(idx){ const s=JSON.parse(localStorage.getItem('tatiana_daydone')||'{}'),k=getWeekKey();if(!s[k])s[k]=[];if(!s[k].includes(idx)){s[k].push(idx);localStorage.setItem('tatiana_daydone',JSON.stringify(s));} }

// ── RENDER PLAN ──
function renderPlan(){
  const todayIdx=getTodayIdx(), doneDays=getDoneDays();
  const container=document.getElementById('weekPlan');
  container.innerHTML='';
  WEEKLY_PLAN.forEach((session,idx)=>{
    const isToday=idx===todayIdx, isDone=doneDays.includes(idx);
    const card=document.createElement('div');
    card.className=`day-card${isToday?' today':''}${isDone?' done':''}`;
    card.id=`day-${idx}`;
    const badge=isDone?'<span class="done-check">✅</span>':isToday?'<span class="today-label">TODAY</span>':'';
    const actions=session.hasTimer
      ?`<button class="btn-start-run" onclick="startRunSession(${idx})">▶ START RUN</button>
        <button class="btn-mark-done${isDone?' done-state':''}" onclick="quickDone(${idx},event)">${isDone?'✅ Done':'✓ Done'}</button>`
      :`<button class="btn-full-done${isDone?' done-state':''}" onclick="quickDone(${idx},event)">${isDone?'✅ Done':'✓ Mark as done'}</button>`;
    card.innerHTML=`
      <div class="day-header" onclick="toggleDay(${idx})">
        <div class="day-left">
          <span class="day-name">${session.day}</span>
          <span class="day-type-badge badge-${session.type}">${session.label}</span>
        </div>${badge}
      </div>
      <div class="day-body">
        <div class="day-desc">${session.desc.replace(/\n/g,'<br>')}</div>
        <div class="session-actions">${actions}</div>
      </div>`;
    container.appendChild(card);
  });
}

function toggleDay(idx){ const card=document.getElementById(`day-${idx}`); if(idx===getTodayIdx())return; card.classList.toggle('expanded'); }

function quickDone(idx,e){
  if(e)e.stopPropagation();
  if(getDoneDays().includes(idx))return;
  saveDoneDay(idx);
  const session=WEEKLY_PLAN[idx];
  const entry={ workout:session.label, duration:'—', date:new Date().toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}), ts:Date.now() };
  addToLog(entry);
  syncToSheet({date:entry.date,workout:entry.workout,duration:'—',notes:'Marked done from plan'});
  renderPlan();
}

// ── START RUN ──
function startRunSession(idx){
  currentDayIdx=idx; activeWorkout=WEEKLY_PLAN[idx].workout;
  document.getElementById('planScreen').style.display='none';
  document.getElementById('timerScreen').style.display='block';
  document.getElementById('timerTitle').textContent=activeWorkout.name.toUpperCase();
  resetTimerState(); buildDots();
}

function backToPlan(){
  if(isRunning){clearInterval(timer);isRunning=false;}
  document.getElementById('timerScreen').style.display='none';
  document.getElementById('planScreen').style.display='block';
  document.body.className='idle';
}

function backToPlanFromComplete(){
  document.getElementById('completeScreen').classList.remove('show');
  document.getElementById('timerScreen').style.display='none';
  document.getElementById('planScreen').style.display='block';
  document.body.className='idle';
  renderPlan();
}

// ── TIMER ──
function resetTimerState(){
  clearInterval(timer);isRunning=false;currentInterval='run';currentRound=0;timeLeft=0;totalElapsed=0;
  document.getElementById('mainBtn').textContent='▶';
  document.getElementById('phaseBadge').textContent='READY';
  document.getElementById('timeDisplay').textContent='00';
  document.getElementById('intervalLabel').textContent='ready';
  document.getElementById('lapDisplay').textContent='0';
  document.getElementById('totalDisplay').textContent='00:00';
  document.getElementById('remainDisplay').textContent='—';
  document.getElementById('progressRing').style.strokeDashoffset='0';
  document.getElementById('nextPreview').textContent='Press play to start';
  document.body.className='idle';
}
function resetTimer(){ resetTimerState(); buildDots(); }

function buildDots(){
  const dots=document.getElementById('lapDots'); dots.innerHTML='';
  if(!activeWorkout)return;
  for(let r=0;r<activeWorkout.rounds;r++){
    ['run','walk'].forEach(type=>{ const d=document.createElement('div');d.className='dot';d.id=`dot-${type}-${r}`;dots.appendChild(d); });
  }
}

function updateDots(){
  if(!activeWorkout)return;
  for(let r=0;r<activeWorkout.rounds;r++){
    const rd=document.getElementById(`dot-run-${r}`),wd=document.getElementById(`dot-walk-${r}`);
    if(r<currentRound){ rd.className='dot run-done';wd.className='dot walk-done'; }
    else if(r===currentRound){ if(currentInterval==='run'){rd.className='dot run-done active';wd.className='dot';}else{rd.className='dot run-done';wd.className='dot walk-done active';} }
    else{ rd.className='dot';wd.className='dot'; }
  }
}

function formatTime(s){ const m=Math.floor(s/60),sec=s%60;return m>0?`${m}:${sec.toString().padStart(2,'0')}`:String(sec); }
function formatTotal(s){ const m=Math.floor(s/60),sec=s%60;return `${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`; }

function updateProgress(){
  const total=currentInterval==='run'?activeWorkout.run:activeWorkout.walk;
  document.getElementById('progressRing').style.strokeDashoffset=691-(691*timeLeft/total);
}

function updateUI(){
  document.getElementById('timeDisplay').textContent=formatTime(timeLeft);
  document.getElementById('lapDisplay').textContent=currentRound+1;
  document.getElementById('totalDisplay').textContent=formatTotal(totalElapsed);
  document.getElementById('remainDisplay').textContent=activeWorkout.rounds-currentRound;
  document.getElementById('intervalLabel').textContent=currentInterval==='run'?'sec to walk':'sec to run';
  document.getElementById('phaseBadge').textContent=currentInterval==='run'?'🏃 RUN':'🚶 WALK';
  document.body.className=currentInterval==='run'?'run-active':'walk-active';
  if(currentInterval==='run'){
    document.getElementById('nextPreview').innerHTML=`Next → <span>Walk ${formatTime(activeWorkout.walk)}</span>`;
  } else {
    const nr=currentRound+1;
    document.getElementById('nextPreview').innerHTML=nr<activeWorkout.rounds
      ?`Next → <span>Run ${formatTime(activeWorkout.run)} · round ${nr+1}</span>`
      :`<span>Last walk — finish strong! 💪</span>`;
  }
  updateProgress(); updateDots();
}

function tick(){
  timeLeft--;totalElapsed++;
  if(timeLeft===3)beepTick();
  if(timeLeft===2){beepTick();if(currentInterval==='run')speak('3',80);}
  if(timeLeft===1){beepTick();if(currentInterval==='run')speak('2',80);}
  if(timeLeft<=0){nextInterval();return;}
  updateUI();
}

function nextInterval(){
  if(currentInterval==='run'){ currentInterval='walk';timeLeft=activeWorkout.walk;beepWalk();speak('Walk now!',300); }
  else{ currentRound++;if(currentRound>=activeWorkout.rounds){completeWorkout();return;}
    currentInterval='run';timeLeft=activeWorkout.run;beepRun();speak(`Round ${currentRound+1}. Start running!`,350); }
  updateUI();
}

function completeWorkout(){
  clearInterval(timer);isRunning=false;
  beepDone();speak('Workout complete! Well done Tatiana!',600);
  document.body.className='idle';
  const btn=document.getElementById('doneFinalBtn');
  btn.textContent='✓ MARK AS DONE';btn.className='btn-done-final';btn.dataset.logged='0';
  document.getElementById('completeStat').textContent=formatTotal(totalElapsed);
  document.getElementById('completeScreen').classList.add('show');
}

function toggleTimer(){
  if(!isRunning){
    getCtx();unlockSpeech();isRunning=true;
    document.getElementById('mainBtn').textContent='⏸';
    if(timeLeft===0){ currentInterval='run';timeLeft=activeWorkout.run;currentRound=0;totalElapsed=0;beepRun();speak("Ready? Let's go! Start running!",500); }
    else speak('Resuming. '+(currentInterval==='run'?'Keep running!':'Keep walking!'),300);
    timer=setInterval(tick,1000);updateUI();
  } else {
    isRunning=false;clearInterval(timer);
    window.speechSynthesis&&speechSynthesis.cancel();
    document.getElementById('mainBtn').textContent='▶';
    document.getElementById('phaseBadge').textContent='PAUSED';
    speak('Paused.',100);
  }
}

function skipInterval(){ if(!isRunning)return;clearInterval(timer);nextInterval();if(isRunning)timer=setInterval(tick,1000); }

// ── LOG & SYNC ──
function logAndSync(){
  const btn=document.getElementById('doneFinalBtn');
  if(btn.dataset.logged==='1'){speak('Already logged!');return;}
  if(currentDayIdx>=0) saveDoneDay(currentDayIdx);
  const entry={ workout:activeWorkout?activeWorkout.name:'Workout', duration:formatTotal(totalElapsed),
    date:new Date().toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}), ts:Date.now() };
  addToLog(entry);
  btn.textContent='⏳ SYNCING...';btn.className='btn-done-final syncing';btn.dataset.logged='1';
  speak('Workout logged! Great job Tatiana!',200);
  syncToSheet({date:entry.date,workout:entry.workout,duration:entry.duration,notes:'Logged from Run Timer app'})
    .then(()=>{btn.textContent='✅ SYNCED TO DRIVE!';btn.className='btn-done-final synced';})
    .catch(()=>{btn.textContent='✅ LOGGED (offline)';btn.className='btn-done-final synced';});
}

function addToLog(entry){ workoutLog.unshift(entry);localStorage.setItem('tatiana_log',JSON.stringify(workoutLog)); }
function syncToSheet(data){ return fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}); }

function renderLog(){
  const list=document.getElementById('logList'),streak=document.getElementById('logStreak');
  if(workoutLog.length===0){list.innerHTML='<div class="log-empty">No workouts logged yet.<br>Complete a session and tap ✓ Done.</div>';streak.innerHTML='';return;}
  streak.innerHTML=`<strong>${workoutLog.length}</strong> workout${workoutLog.length>1?'s':''} completed 🔥`;
  const exportBtn=document.getElementById('exportBtn');
  if(exportBtn) exportBtn.style.display=workoutLog.length>0?'block':'none';
  list.innerHTML=workoutLog.slice(0,15).map(e=>`
    <div class="log-entry">
      <div class="log-left"><span class="log-name">${e.workout}</span><span class="log-date">${e.date}</span></div>
      <span class="log-time">${e.duration}</span>
    </div>`).join('');
}

// ── EXPORT CSV ──
function exportCSV(){
  if(workoutLog.length===0)return;
  const rows=[['Date','Workout','Duration','Timestamp']];
  workoutLog.forEach(e=>rows.push([e.date, e.workout, e.duration, new Date(e.ts).toISOString()]));
  const csv=rows.map(r=>r.map(v=>`"${v}"`).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='tatiana_workout_log.csv'; a.click();
  URL.revokeObjectURL(url);
}

// ── INIT ──
renderPlan();
</script>
